[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ipalab"
version = "1.0.0"
description = "Read-only inspector for iOS .ipa archives: metadata, entitlements, Mach-O and code-signature analysis."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "MayoMusic" }]
keywords = ["ios", "ipa", "macho", "entitlements", "codesign", "inspector"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Disassemblers",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
certs = ["cryptography>=41"]
gui = ["customtkinter>=5.2"]
dev = ["pytest>=7", "ruff>=0.6"]

[project.gui-scripts]
ipalab-gui = "ipalab.gui:main"

[project.urls]
Homepage = "https://github.com/MayoMusic/ipalab"
Source = "https://github.com/MayoMusic/ipalab"
Issues = "https://github.com/MayoMusic/ipalab/issues"

[project.scripts]
ipalab = "ipalab.cli:main"

[tool.setuptools.packages.find]
include = ["ipalab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]