name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install ruff
      - name: Check formatting rules
        run: ruff check --output-format=github .

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        exclude:
          # GitHub no longer ships 3.9 for Apple Silicon runners.
          - os: macos-latest
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest --junitxml=junit.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.os }}-py${{ matrix.python-version }}
          path: junit.xml
          retention-days: 7

  build:
    name: Build distributions
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build sdist and wheel
        run: python -m build
      - name: Smoke test the wheel
        run: |
          pip install dist/*.whl
          ipalab --version
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 30

  windows-exe:
    name: Windows executable
    needs: [lint, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui]" pyinstaller
      - name: Build standalone executable
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --console --name ipalab --paths . --exclude-module pytest --exclude-module ruff --distpath dist --workpath build scripts/ipalab_entry.py
      - name: Smoke test the executable
        run: |
          python scripts/make_samples.py
          .\dist\ipalab.exe --version

          .\dist\ipalab.exe inspect samples\Reader.ipa --no-colour
          if ($LASTEXITCODE -ne 0) { throw "inspect on a clean archive must exit 0" }

          .\dist\ipalab.exe inspect samples\Reader.ipa --json
          if ($LASTEXITCODE -ne 0) { throw "inspect --json must exit 0" }

          # samples/Unsigned.ipa deliberately contains an unsigned binary, so
          # a scan over the directory is expected to report exit code 1.
          .\dist\ipalab.exe scan samples --quiet --no-colour
          if ($LASTEXITCODE -ne 1) { throw "scan must exit 1 when an error finding exists" }

          Write-Output "smoke test passed"

          # The runner's PowerShell wrapper re-raises $LASTEXITCODE at the end
          # of the step, so the exit code must be set explicitly.
          exit 0
      - uses: actions/upload-artifact@v7
        with:
          name: ipalab-windows-x64
          path: dist/ipalab.exe
          retention-days: 30

      - name: Build graphical executable
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name ipalab-gui --paths . --collect-all customtkinter --exclude-module pytest --exclude-module ruff --distpath dist --workpath build-gui scripts/gui_entry.py
      - name: Smoke test the GUI
        run: |
          $p = Start-Process -FilePath .\dist\ipalab-gui.exe -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { throw "GUI executable exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Output "GUI executable launched successfully"
      - uses: actions/upload-artifact@v7
        with:
          name: ipalab-gui-windows-x64
          path: dist/ipalab-gui.exe
          retention-days: 30

  publish:
    name: Publish to PyPI
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1